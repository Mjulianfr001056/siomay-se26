name: Build and publish SIOMAY portable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install application dependencies
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Build stable portable application
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          FLET_CLI_NO_RICH_OUTPUT: "1"
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $buildVersion = $version -replace '-.*$'
          git clone --local . stable-source
          (Get-Content stable-source/src/app_config.py) -replace 'APP_VERSION = ".*"', "APP_VERSION = `"$version`"" | Set-Content stable-source/src/app_config.py
          Set-Location stable-source
          flet build windows --yes --no-rich-output --module-name app --project SIOMAY --product SIOMAY --artifact SIOMAY --build-version $buildVersion --output ../build/stable

      - name: Build beta portable application
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          FLET_CLI_NO_RICH_OUTPUT: "1"
        run: |
          git clone --local . beta-source
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $buildVersion = $version -replace '-.*$'
          (Get-Content beta-source/src/app_config.py) -replace 'APP_VERSION = ".*"', "APP_VERSION = `"$version`"" -replace 'UPDATE_CHANNEL = os.environ.get\("SIOMAY_UPDATE_CHANNEL", "stable"\).lower\(\)', 'UPDATE_CHANNEL = "beta"' | Set-Content beta-source/src/app_config.py
          Set-Location beta-source
          flet build windows --yes --no-rich-output --module-name app --project "SIOMAY Beta" --product "SIOMAY Beta" --artifact "SIOMAY Beta" --build-version $buildVersion --output ../build/beta

      - name: Package portable ZIP files and checksums
        id: package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $stableZip = "SIOMAY-$tag-windows.zip"
          $betaZip = "SIOMAY-Beta-$tag-windows.zip"
          $stableExe = Get-ChildItem -Path build/stable -Recurse -File -Filter "SIOMAY.exe" | Select-Object -First 1
          $betaExe = Get-ChildItem -Path build/beta -Recurse -File -Filter "SIOMAY Beta.exe" | Select-Object -First 1
          if ($null -eq $stableExe) { throw "Could not find SIOMAY.exe in build/stable." }
          if ($null -eq $betaExe) { throw "Could not find SIOMAY Beta.exe in build/beta." }
          Remove-Item -Path package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -Path package/SIOMAY, "package/SIOMAY Beta" -ItemType Directory -Force | Out-Null
          Copy-Item -Path (Join-Path $stableExe.Directory.FullName "*") -Destination package/SIOMAY -Recurse -Force
          Copy-Item -Path (Join-Path $betaExe.Directory.FullName "*") -Destination "package/SIOMAY Beta" -Recurse -Force
          Compress-Archive -Path package/SIOMAY -DestinationPath $stableZip -CompressionLevel Optimal
          Compress-Archive -Path "package/SIOMAY Beta" -DestinationPath $betaZip -CompressionLevel Optimal
          $stableHash = (Get-FileHash $stableZip -Algorithm SHA256).Hash.ToLower()
          $betaHash = (Get-FileHash $betaZip -Algorithm SHA256).Hash.ToLower()
          @(
            "## Checksums"
            ""
            "- ${stableZip}: $stableHash"
            "- ${betaZip}: $betaHash"
          ) | Set-Content -Path RELEASE_NOTES.md
          "prerelease=$($tag.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ steps.package.outputs.prerelease }}
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: |
            SIOMAY-*-windows.zip